[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "architecture-workbench"
version = "0.6.2"
description = "Windows architecture agent workspace using local Codex and CodeBuddy"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "python-multipart>=0.0.20,<1", "mcp>=1.12,<2", "pypdf>=5,<7", "python-docx>=1.1,<2", "python-pptx>=1.0,<2", "pypdfium2>=4,<6", "openpyxl>=3.1,<4", "Pillow>=10,<13", "ezdxf>=1.3,<2", "tzdata>=2025.1", "websockets>=15,<18", "cryptography>=44,<51"]

[project.optional-dependencies]
desktop = ["pywebview>=5,<7", "pystray>=0.19,<1", "pywin32>=308; sys_platform == 'win32'", "fastmcp>=3.4,<4", "PyYAML>=6,<7"]
test = ["pytest>=8,<10"]
ui-test = ["playwright>=1.50,<2"]
build = ["pyinstaller>=6,<7"]

[project.scripts]
architecture-workbench = "architecture_workbench.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
